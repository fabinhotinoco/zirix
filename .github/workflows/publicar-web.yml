name: 3. Publicar a versão web (link para abrir no iPhone)

# Gera uma versão do aplicativo que roda no navegador e publica na hospedagem
# da Expo. Você recebe um endereço que abre em qualquer aparelho — inclusive no
# iPhone, sem Xcode, sem TestFlight e sem a conta paga da Apple.
#
# Não substitui o aplicativo de verdade: câmera, GPS e notificações se comportam
# diferente no navegador. Serve para percorrer as telas e conferir os textos, os
# fluxos e os cálculos.
#
# Usa o mesmo segredo EXPO_TOKEN do robô 2.
on:
  workflow_dispatch:

jobs:
  publicar:
    name: Publicar na hospedagem da Expo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ykdbdpdepkdtyxtcwwex.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_npV2ODt7TI8PfDGS8RTN9Q_Q9tl6aNm
      EXPO_PUBLIC_MP_CLIENT_ID: "3656945704772537"
    steps:
      - uses: actions/checkout@v5

      - name: Conferir se o segredo existe
        env:
          TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta o segredo EXPO_TOKEN. Veja docs/SEM-TERMINAL.md."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Gerar a versão web
        run: npx expo export --platform web --output-dir dist

      - name: Publicar
        run: eas deploy --prod --non-interactive

      - name: Onde abrir
        run: |
          echo "O endereço fixo aparece na linha 'Production URL' logo acima."
          echo ""
          echo "Ele também fica em https://expo.dev/accounts -> seu projeto -> Hosting."
          echo "Abra esse endereço no Safari do iPhone e adicione à tela de início"
          echo "para ele abrir como um aplicativo."
