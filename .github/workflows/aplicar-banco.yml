name: 1. Preparar o banco no Supabase

# Você aperta um botão e este robô cria as tabelas, as regras de segurança, os
# valores padrão e os documentos legais no seu projeto Supabase.
#
# Precisa de um segredo chamado SUPABASE_DB_URL. Como criá-lo está em
# docs/SEM-TERMINAL.md.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite APLICAR para confirmar'
        required: true
        default: ''

jobs:
  aplicar:
    name: Aplicar no Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Conferir a confirmação
        if: inputs.confirmar != 'APLICAR'
        run: |
          echo "::error::Para evitar execução acidental, digite APLICAR no campo de confirmação."
          exit 1

      - uses: actions/checkout@v4

      - name: Conferir o segredo
        env:
          URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Falta o segredo SUPABASE_DB_URL. Veja docs/SEM-TERMINAL.md."
            exit 1
          fi

          # Sem o prefixo, o psql entende o texto como nome de um banco local e
          # tenta conectar na própria máquina — erro que não indica a causa.
          case "$URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::O segredo SUPABASE_DB_URL não começa com postgresql://"
              echo ""
              echo "Ele precisa ser o endereço completo, no formato:"
              echo "  postgresql://postgres:SENHA@db.SEUPROJETO.supabase.co:5432/postgres"
              echo ""
              echo "No Supabase: Project Settings -> Database -> Connection string -> URI."
              echo "Copie a linha inteira, não apenas a senha."
              exit 1
              ;;
          esac

          # O trecho depois do @ não é secreto: serve para você conferir se o
          # endereço é mesmo o do seu projeto.
          echo "Vai conectar em: ${URL##*@}"

      - name: Testar a conexão
        env:
          URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if ! psql "$URL" -tAc "select 1" > /dev/null 2> /tmp/erro; then
            echo "::error::Não consegui conectar no banco."
            echo ""
            sed 's/^/  /' /tmp/erro
            echo ""

            # A conexão direta do Supabase (db.SEUPROJETO.supabase.co) só
            # responde em IPv6, e os servidores do GitHub não têm IPv6.
            # É a causa mais comum aqui, e o erro não deixa isso óbvio.
            if grep -q "Network is unreachable" /tmp/erro; then
              echo "CAUSA: você copiou a conexão DIRETA, que só funciona em IPv6."
              echo "Os servidores do GitHub não têm IPv6, então nunca alcançam esse endereço."
              echo ""
              echo "SOLUÇÃO: use o endereço do POOLER, que funciona em IPv4."
              echo ""
              echo "No Supabase: Project Settings -> Database -> Connection string."
              echo "Ali existem abas. Escolha *Session pooler* (porta 5432),"
              echo "não *Direct connection*."
              echo ""
              echo "O endereço certo tem esta cara — repare no 'pooler.supabase.com'"
              echo "e no usuário 'postgres.SEUPROJETO':"
              echo "  postgresql://postgres.xxxx:SENHA@aws-0-sa-east-1.pooler.supabase.com:5432/postgres"
              echo ""
              echo "A senha é a mesma. Muda só o endereço e o usuário."
            elif grep -qi "password authentication failed" /tmp/erro; then
              echo "CAUSA: a senha dentro do endereço está errada."
              echo ""
              echo "Confira se você substituiu [YOUR-PASSWORD] pela senha real,"
              echo "e se ela não tem caracteres especiais (/ * @ # ?), que quebram"
              echo "o endereço. Se tiver, gere outra em"
              echo "Project Settings -> Database -> Reset database password."
            else
              echo "Confira o endereço e a senha no segredo SUPABASE_DB_URL."
            fi
            exit 1
          fi
          echo "Conexão bem-sucedida."

      - name: Ver se o banco já foi preparado antes
        env:
          URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          JA=$(psql "$URL" -tAc "select count(*) from information_schema.tables
                                 where table_schema='public' and table_name='bookings';")
          if [ "$JA" != "0" ]; then
            echo "::error::Este banco já tem as tabelas. Rodar de novo daria erro."
            echo "Se quiser começar do zero, apague as tabelas no painel antes."
            exit 1
          fi
          echo "Banco vazio: pode aplicar."

      - name: Aplicar tabelas, segurança, padrões e documentos
        env:
          URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$URL" -v ON_ERROR_STOP=1 -f supabase/setup-completo.sql

      - name: Conferir o resultado
        env:
          URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "O que ficou no seu banco:"
          psql "$URL" -c "
            select
              (select count(*) from information_schema.tables
                where table_schema='public' and table_type='BASE TABLE') as tabelas,
              (select count(*) from pg_policies where schemaname='public')  as regras_de_seguranca,
              (select count(*) from public.app_settings)                    as configuracoes,
              (select count(*) from public.cancellation_rules)              as faixas_cancelamento,
              (select count(*) from public.legal_documents)                 as documentos_legais;"
          echo ""
          echo "Esperado: 19 tabelas, 35 regras, 14 configurações, 5 faixas, 5 documentos."
