name: 13. Publicar as funções do servidor

# Publica as Edge Functions do Supabase e leva os segredos que elas precisam
# do cofre do GitHub para o cofre do Supabase.
#
# Nenhum segredo aparece no registro, que é público. O CLI do Supabase imprime
# apenas o nome e um resumo (digest) de cada segredo, nunca o valor.
on:
  workflow_dispatch:

jobs:
  publicar:
    name: Publicar mp-oauth
    runs-on: ubuntu-latest
    env:
      PROJETO: ykdbdpdepkdtyxtcwwex
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Conferir se o acesso ao Supabase foi guardado
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN."
            echo "Crie em https://supabase.com/dashboard/account/tokens e guarde em"
            echo "https://github.com/fabinhotinoco/zirix/settings/secrets/actions"
            echo "O passo a passo está na Preparação 6 de docs/SEM-TERMINAL.md."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # -----------------------------------------------------------------------
      # A chave que cifra os tokens dos guias.
      #
      # É gerada AQUI, uma vez, e nunca mais. Não passa por tela, por chat nem
      # por registro de execução — ninguém precisa vê-la, nem eu, nem você.
      #
      # E não pode ser regerada: trocá-la torna ilegível todo token já guardado,
      # e cada guia teria de reconectar a conta. Por isso o passo confere antes
      # se ela já existe, em vez de simplesmente criar.
      # -----------------------------------------------------------------------
      - name: Garantir a chave de cifra dos tokens
        run: |
          if supabase secrets list --project-ref "$PROJETO" | grep -q '^ *MP_TOKEN_KEY '; then
            echo "✓ chave de cifra já existe — mantida como está"
          else
            echo "→ primeira publicação: gerando a chave de cifra"
            CHAVE=$(openssl rand -base64 48 | tr -d '\n')
            echo "::add-mask::$CHAVE"
            supabase secrets set --project-ref "$PROJETO" "MP_TOKEN_KEY=$CHAVE"
            echo "✓ chave gerada e guardada no cofre do Supabase"
          fi

      - name: Levar os segredos do Mercado Pago para o Supabase
        env:
          MP_CLIENT_ID: ${{ secrets.MP_CLIENT_ID }}
          MP_CLIENT_SECRET: ${{ secrets.MP_CLIENT_SECRET }}
        run: |
          if [ -z "$MP_CLIENT_ID" ] || [ -z "$MP_CLIENT_SECRET" ]; then
            echo "::error::Faltam MP_CLIENT_ID e/ou MP_CLIENT_SECRET. Veja a Preparação 5."
            exit 1
          fi
          supabase secrets set --project-ref "$PROJETO" \
            "MP_CLIENT_ID=$MP_CLIENT_ID" \
            "MP_CLIENT_SECRET=$MP_CLIENT_SECRET" \
            "MP_REDIRECT_URI=https://$PROJETO.supabase.co/functions/v1/mp-oauth" \
            "APP_URL=https://aplicativo-de-agendamento-pesca-vertical.expo.app"

      # --no-verify-jwt porque quem chega nesta função é o navegador do guia
      # voltando do Mercado Pago, sem cabeçalho de autorização. Sem esta opção,
      # o Supabase responde 401 antes de a função rodar, e o guia vê um erro
      # que não tem nada a ver com o que aconteceu. Quem verifica a identidade
      # é o `state`, dentro da função.
      - name: Publicar a função mp-oauth
        run: supabase functions deploy mp-oauth --project-ref "$PROJETO" --no-verify-jwt

      # ESTA fica COM verificação de JWT (o padrão). Sem isso, o endereço seria
      # um proxy de previsão de graça para o mundo inteiro, pago pela cota da
      # plataforma.
      - name: Publicar a função previsao
        run: supabase functions deploy previsao --project-ref "$PROJETO"

      # Também com JWT: é o pagador logado quem pede a cobrança, e o id dele sai
      # do token verificado — nunca de um campo do corpo, que qualquer um
      # escreveria.
      - name: Publicar a função cobrar
        run: supabase functions deploy cobrar --project-ref "$PROJETO"

      # SEM verificação de JWT: quem chama é o Mercado Pago, que não tem como
      # carregar um token nosso. O que protege este endereço não é login — é a
      # função não acreditar no corpo do aviso: ela lê o pagamento de volta da
      # API com o token do guia, e um aviso forjado não encontra nada lá.
      - name: Publicar a função mp-webhook
        run: supabase functions deploy mp-webhook --project-ref "$PROJETO" --no-verify-jwt

      - name: Conferir que a função responde
        run: |
          URL="https://$PROJETO.supabase.co/functions/v1/mp-oauth"
          echo "→ chamando $URL sem parâmetros (deve recusar com 400)"
          CODIGO=$(curl -sS -o /tmp/resposta.html -w '%{http_code}' "$URL")
          echo "  HTTP $CODIGO"
          if [ "$CODIGO" = "401" ]; then
            echo "::error::A função exigiu autorização. Ela precisa ser publicada com --no-verify-jwt."
            exit 1
          fi
          if [ "$CODIGO" != "400" ]; then
            echo "::error::Esperava 400 (endereço incompleto) e veio $CODIGO."
            exit 1
          fi
          if grep -q "Configuração incompleta" /tmp/resposta.html; then
            echo "::error::A função subiu, mas está sem algum segredo. Veja o registro dela no painel do Supabase."
            exit 1
          fi
          grep -q "Endereço incompleto" /tmp/resposta.html \
            && echo "✓ mp-oauth está no ar e recusa chamada sem código, como deve"

          echo "→ conferindo que previsao EXIGE login"
          PREV=$(curl -sS -o /dev/null -w '%{http_code}' "https://$PROJETO.supabase.co/functions/v1/previsao?lat=-22.9&lng=-43.1")
          echo "  HTTP $PREV"
          if [ "$PREV" != "401" ]; then
            echo "::error::A função previsao respondeu $PREV sem login. Ela precisa exigir JWT, senão vira proxy grátis."
            exit 1
          fi
          echo "✓ previsao exige login, como deve"

          echo "→ conferindo que cobrar EXIGE login"
          COB=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{}' \
            "https://$PROJETO.supabase.co/functions/v1/cobrar")
          echo "  HTTP $COB"
          if [ "$COB" != "401" ]; then
            echo "::error::A função cobrar respondeu $COB sem login. Ela precisa exigir JWT."
            exit 1
          fi
          echo "✓ cobrar exige login, como deve"

          echo "→ conferindo que mp-webhook aceita chamada SEM login"
          # Aviso de tipo que não é pagamento: a função devolve 200 e ignora.
          # Se vier 401, ela subiu com verificação de JWT e o Mercado Pago
          # nunca conseguiria avisar — o dinheiro entraria e ninguém saberia.
          WH=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{"type":"merchant_order"}' \
            "https://$PROJETO.supabase.co/functions/v1/mp-webhook")
          echo "  HTTP $WH"
          if [ "$WH" = "401" ]; then
            echo "::error::mp-webhook exigiu login. Precisa ser publicada com --no-verify-jwt."
            exit 1
          fi
          if [ "$WH" != "200" ]; then
            echo "::error::mp-webhook respondeu $WH para um aviso que devia ignorar."
            exit 1
          fi
          echo "✓ mp-webhook aceita o aviso do Mercado Pago"
