name: 7. Criar uma conta de acesso (sem depender de e-mail)

# Cria uma conta de acesso direto no banco, com senha e e-mail já confirmado.
# Nenhum e-mail é enviado — é isso que permite entrar no aplicativo enquanto o
# envio de e-mail do projeto estiver com problema.
#
# NÃO cria perfil nem grava aceites: isso continua sendo feito pelo aplicativo,
# na tela de cadastro. É justamente esse fluxo que precisa ser testado.
#
# Duas contas, dois pares de segredos, além do SUPABASE_DB_URL:
#   ADMIN_EMAIL / ADMIN_SENHA   a sua conta de administrador
#   GUIA_EMAIL  / GUIA_SENHA    uma conta para testar o lado do guia
#
# Ter as duas ao mesmo tempo evita o vaivém de reescrever o mesmo segredo — e
# o vaivém é onde se perde a senha da conta que já existia.
#
# Vão como segredo, e não como campo de formulário, porque este repositório é
# público: campos e registros de execução ficam visíveis para qualquer pessoa,
# segredos não.
on:
  workflow_dispatch:
    inputs:
      conta:
        description: 'Qual conta criar'
        required: true
        default: admin
        type: choice
        options: [admin, guia]

jobs:
  criar:
    name: Criar a conta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Conferir o endereço de conexão
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: tools/checar-conexao.sh

      - name: Escolher o par de segredos
        id: conta
        env:
          ESCOLHA: ${{ inputs.conta }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}
          GUIA_EMAIL: ${{ secrets.GUIA_EMAIL }}
          GUIA_SENHA: ${{ secrets.GUIA_SENHA }}
        run: |
          if [ "$ESCOLHA" = "guia" ]; then
            PREFIXO=GUIA; EMAIL="$GUIA_EMAIL"; SENHA="$GUIA_SENHA"
          else
            PREFIXO=ADMIN; EMAIL="$ADMIN_EMAIL"; SENHA="$ADMIN_SENHA"
          fi

          if [ -z "$EMAIL" ] || [ -z "$SENHA" ]; then
            echo "::error::Faltam os segredos ${PREFIXO}_EMAIL e/ou ${PREFIXO}_SENHA."
            echo ""
            echo "Crie-os em:"
            echo "  https://github.com/fabinhotinoco/zirix/settings/secrets/actions"
            echo ""
            echo "${PREFIXO}_EMAIL: o e-mail com que essa conta vai entrar"
            echo "${PREFIXO}_SENHA: uma senha de 8 caracteres ou mais"
            exit 1
          fi
          if [ "${#SENHA}" -lt 8 ]; then
            echo "::error::${PREFIXO}_SENHA tem menos de 8 caracteres."
            exit 1
          fi

          # Marcar como segredo antes de qualquer uso: sem isto, um passo
          # seguinte pode ecoar o valor no registro, que é público.
          echo "::add-mask::$EMAIL"
          echo "::add-mask::$SENHA"
          {
            echo "email=$EMAIL"
            echo "senha=$SENHA"
          } >> "$GITHUB_OUTPUT"
          echo "Usando o par ${PREFIXO}_*."

      - name: Criar (ou atualizar a senha da) conta
        env:
          URL: ${{ secrets.SUPABASE_DB_URL }}
          EMAIL: ${{ steps.conta.outputs.email }}
          SENHA: ${{ steps.conta.outputs.senha }}
        run: |
          psql "$URL" -v ON_ERROR_STOP=1 \
            -v email="$EMAIL" -v senha="$SENHA" \
            -f supabase/criar-primeiro-usuario.sql \
            > /tmp/saida 2>&1 || { echo "::error::Falhou ao criar a conta."; sed 's/^/  /' /tmp/saida; exit 1; }

          # A saída do psql repete o e-mail. Este registro é público: filtra.
          grep -v "@" /tmp/saida || true

      - name: Conferir sem revelar dados
        env:
          URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$URL" -c "
            select
              count(*)                                              as contas,
              count(*) filter (where email_confirmed_at is not null) as confirmadas,
              count(*) filter (where encrypted_password is not null
                               and encrypted_password <> '')         as com_senha,
              (select count(*) from auth.identities)                 as identidades
            from auth.users;"
          echo ""
          echo "Agora entre no aplicativo com o e-mail e a senha que você guardou"
          echo "nos segredos, usando a aba 'Senha' da tela de entrada:"
          echo "  https://aplicativo-de-agendamento-pesca-vertical.expo.app"
          echo ""
          echo "Você vai cair na tela de cadastro para preencher nome e aceitar"
          echo "os documentos — esse fluxo continua igual."
