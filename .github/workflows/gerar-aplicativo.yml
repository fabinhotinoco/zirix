name: 2. Gerar o aplicativo para testar

# Monta o aplicativo na nuvem (servidores da Expo) e devolve um link para você
# instalar no celular. Nada é instalado no seu computador.
#
# Precisa de um segredo chamado EXPO_TOKEN. Como criá-lo está em
# docs/SEM-TERMINAL.md.
on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'Para qual celular'
        required: true
        default: android
        type: choice
        options:
          - android
          - ios-simulador
          - ios
          - all

jobs:
  gerar:
    name: Montar na nuvem
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - name: Conferir se o segredo existe
        env:
          TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta o segredo EXPO_TOKEN. Veja docs/SEM-TERMINAL.md."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Montar o aplicativo
        env:
          ESCOLHA: ${{ inputs.plataforma }}
        run: |
          # "ios-simulador" não é uma plataforma do EAS: é a plataforma ios com
          # um perfil diferente, que gera um app para o simulador do Xcode em
          # vez de um app assinado para iPhone de verdade. Só esse caminho
          # dispensa a conta paga da Apple.
          if [ "$ESCOLHA" = "ios-simulador" ]; then
            PLATAFORMA=ios
            PERFIL=simulador
          else
            PLATAFORMA="$ESCOLHA"
            PERFIL=preview
          fi

          echo "Plataforma: $PLATAFORMA   Perfil: $PERFIL"

          eas build \
            --platform "$PLATAFORMA" \
            --profile "$PERFIL" \
            --non-interactive \
            --wait

      - name: Onde baixar
        env:
          ESCOLHA: ${{ inputs.plataforma }}
        run: |
          echo "Pronto. O link para baixar está em:"
          echo "  https://expo.dev/accounts  ->  seu projeto  ->  Builds"
          echo ""
          case "$ESCOLHA" in
            ios-simulador)
              echo "Você escolheu o simulador de iPhone. Baixe o arquivo .tar.gz,"
              echo "descompacte com dois cliques e arraste o PescaVerticalAPP.app"
              echo "para dentro da janela do simulador aberto no seu Mac."
              echo "Isso exige um Mac com chip Apple; em Mac Intel o arquivo não instala."
              echo "Veja o passo a passo em docs/IPHONE.md."
              ;;
            ios)
              echo "No iPhone de verdade, o aplicativo chega pelo TestFlight."
              echo "Isso exige a conta paga de desenvolvedor da Apple (US\$ 99/ano)."
              ;;
            *)
              echo "No Android, abra o link pelo celular e instale o arquivo .apk."
              ;;
          esac
